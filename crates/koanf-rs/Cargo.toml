[package]
name = "koanf-rs"
description = "Rust configuration library with layered sources, multiple formats, typed serde access, and file watching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/koanf-rs"
keywords = ["config", "configuration", "settings", "koanf", "watch"]
categories = ["config"]

[dependencies]
koanf-core = { path = "../koanf-core", version = "0.1.0" }
serde.workspace = true
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
serde_yaml_ng = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
rust-ini = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
glob-pattern = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = ["json", "toml", "yaml", "file", "env", "args", "watch"]
json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:serde_yaml_ng"]
dotenv = ["dep:dotenvy"]
ini = ["dep:rust-ini"]
ron = ["dep:ron"]
glob = ["file", "dep:glob-pattern"]
file = []
env = []
args = []
watch = ["file", "dep:notify", "dep:notify-debouncer-full"]
async = ["koanf-core/async"]
http = ["dep:reqwest", "dep:sha2"]
consul = ["dep:reqwest", "dep:base64", "dep:serde_json"]
vault = ["dep:reqwest", "dep:serde_json"]

[dev-dependencies]
tempfile.workspace = true
trybuild.workspace = true
serde_json.workspace = true

[[example]]
name = "basic"

[[example]]
name = "typed"
required-features = ["file", "env", "args", "toml"]

[[example]]
name = "layered"
required-features = ["file", "env", "args", "toml"]

[[example]]
name = "watch"
required-features = ["watch", "toml"]

[package.metadata.docs.rs]
all-features = true
