[package]
name = "koanf-core"
description = "Core engine for koanf-rs: values, paths, layered merging, snapshots, and watch primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/koanf-core"
keywords = ["config", "configuration", "settings", "koanf"]
categories = ["config"]

[dependencies]
serde.workspace = true
serde_path_to_error.workspace = true
indexmap.workspace = true
futures-core = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
async = ["dep:futures-core", "dep:futures-channel"]
tracing = ["dep:tracing"]

[dev-dependencies]
serde_json.workspace = true
futures-executor.workspace = true

[package.metadata.docs.rs]
all-features = true
