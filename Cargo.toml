[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
toml = { version = "1.2", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
dotenvy = "0.15"
rust-ini = "0.21"
ron = "0.12"
base64 = "0.23"
glob-pattern = { package = "glob", version = "0.3" }
notify = "8.2"
notify-debouncer-full = "0.7"
futures-core = "0.3"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-executor = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "deflate", "zstd"] }
sha2 = "0.11"
tempfile = "3"
trybuild = "1"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["weilanzhuan@gmail.com"]
license = "Apache-2.0"
repository = "https://github.com/hushink/koanf-rs"
