name: Release-plz

on:
  push:
    # Keep this in sync with the repository's default branch.
    branches: [main]
  # Useful for retrying the initial 0.1.0 release (for example after adding the
  # temporary token) or for re-running a failed release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'hushink'
    permissions:
      contents: read
    outputs:
      bootstrap: ${{ steps.crates.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - name: Test before publishing
        # The compile-fail doctest still runs; the trybuild UI test is skipped
        # here because its expected stderr is compiler/platform-sensitive and
        # is already exercised by the CI workflow.
        run: cargo test --workspace --all-features --locked -- --skip watched_requires_watchable
      - name: Test no_std and WebAssembly builds
        run: |
          cargo test -p koanf-core --no-default-features --locked
          cargo check -p koanf-core --no-default-features --locked \
            --target thumbv7em-none-eabihf
          cargo check -p koanf-rs --locked --target wasm32-unknown-unknown
          cargo check -p koanf-rs --locked --target wasm32-unknown-unknown \
            --no-default-features --features json,toml,yaml,derive
      - name: Check whether the crates exist on crates.io
        id: crates
        run: |
          missing=0
          for crate in koanf-core koanf-derive koanf-rs; do
            status=$(curl -sL -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: koanf-rs-release-check' \
              "https://crates.io/api/v1/crates/$crate")
            if [ "$status" != "200" ]; then
              echo "::notice::$crate is not published yet (HTTP $status)"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

  release-plz-bootstrap:
    name: Release-plz bootstrap (temporary token)
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.release-check.outputs.bootstrap == 'true' && github.repository_owner == 'hushink'
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the temporary bootstrap token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required until all crates exist on crates.io."
            echo "Add a crates.io token scoped to creating koanf-core, koanf-derive, and koanf-rs as a repository secret, then re-run this workflow."
            exit 1
          fi
      - name: Bootstrap initial release
        uses: release-plz/action@1fb72a9583c3601c197b3bd6fc6ce50d58e28ef3 # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Temporary token: crates.io cannot create new crates via OIDC.
          # Delete this secret after the first successful release.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-release:
    name: Release-plz release (trusted publishing)
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.release-check.outputs.bootstrap == 'false' && github.repository_owner == 'hushink'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Release with trusted publishing
        uses: release-plz/action@1fb72a9583c3601c197b3bd6fc6ce50d58e28ef3 # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: release-plz exchanges the job's OIDC token
          # for a short-lived crates.io token.

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'hushink'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@1fb72a9583c3601c197b3bd6fc6ce50d58e28ef3 # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
