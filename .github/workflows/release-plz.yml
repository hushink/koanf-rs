name: Release-plz

on:
  push:
    # Keep this in sync with the repository's default branch.
    branches: [master, main]
  # Useful for retrying the initial 0.1.0 release after adding the crates.io
  # token, or for re-running a failed release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'hushink'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test before publishing
        # The compile-fail doctest still runs; the trybuild UI test is skipped
        # here because its expected stderr is compiler/platform-sensitive and
        # is already exercised by the CI workflow.
        run: cargo test --workspace --all-features --locked -- --skip watched_requires_watchable
      - name: Run release-plz
        uses: release-plz/action@1fb72a9583c3601c197b3bd6fc6ce50d58e28ef3 # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Remove this token and add `id-token: write` above to use crates.io
          # trusted publishing. The first publish of a new crate still needs
          # to be done manually in that setup.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'hushink'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@1fb72a9583c3601c197b3bd6fc6ce50d58e28ef3 # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
